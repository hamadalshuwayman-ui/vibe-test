name: Daily news brief

on:
  schedule:
    # 04:00 UTC = 07:00 Riyadh time (UTC+3, no daylight saving), Monday to Friday.
    - cron: "0 4 * * 1-5"
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab
  push:                     # TEMPORARY, for testing: run on pushes to the test branch
    branches: [claude/compassionate-wozniak-ydjb2d]

permissions:
  contents: write           # lets the job save the brief back to the repository

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check the API key is set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::No ANTHROPIC_API_KEY secret. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write the brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python newsagent.py

      - name: Save the brief
        run: |
          git config user.name "news-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefs/
          git diff --cached --quiet || git commit -m "News brief for $(date -u +%Y-%m-%d)"
          git push
